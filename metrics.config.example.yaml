# Конфигурация llm-metrics API (ТЗ §3.3).
# Скопировать в metrics.config.yaml и отредактировать.
# Переменная окружения METRICS_CONFIG задаёт путь (в контейнере: /data/metrics.config.yaml).
sources:
  vllm:
    # vLLM в этом же compose: http://vllm:8000;
    # vLLM на хосте вне compose: http://host.docker.internal:8000 (host-gateway);
    # dev без docker с dev-хоста: http://192.168.1.114:8000
    url: http://vllm:8000
    metrics_path: /metrics
    poll_seconds: 5
    # model_name: "Qwen3.6-27B"       # опционально; иначе имя берётся из лейблов model_name
  gpus:
    poll_seconds: 10
    visible: all                      # или [0, 1]
  system:
    poll_seconds: 10
  logs:                               # лог-индексатор (F3)
    sources:
      # vLLM в контейнере compose — читать docker logs:
      - name: vllm
        type: docker
        container: vllm
      # — либо file, если vLLM пишет в файл на хосте (см. compose, volumes api):
      # - name: vllm
      #   type: file
      #   path: /mnt/storage/vllm/nohup.log
    poll_seconds: 1
    retention_days: 14                 # ретенция log_entries, дней (1..365)
storage:
  sqlite_path: /data/metrics.db       # dev: ./data/metrics.db
  retention:
    raw_hours: 168                    # 7 дней
    hourly_days: 180
    daily_days: null                  # безлимитно
cost:
  currency: USD
  electricity:
    rate_per_kwh_usd: 0.10
    system_baseline_watts: 200
  tokens:
    per_million_usd:
      prompt: 0.5
      completion: 1.5

alerts:
  enabled: true
  # Полный URL Telegram webhook: https://api.telegram.org/bot<TOKEN>/sendMessage?chat_id=<CHAT>
  # (правила и webhook можно менять из UI — вкладка «Алерты»; UI-значения имеют приоритет)
  telegram_webhook: null
  check_interval_s: 30
