# logrotate для хост-лога vLLM (scripts/vllm-host.sh).
# copytruncate: vLLM (nohup-redirect, O_APPEND) не умеет реагировать на
# сигналы ротации — truncate безопасен; tailer api умеет переносить
# ротацию (смена inode / уменьшение размера → перечитывает с начала).
# Установка: make install-logrotate (подставит реальный путь из VLLM_LOG_DIR)
/mnt/storage/vllm/vllm.log {
    size 100M
    rotate 4
    copytruncate
    missingok
    compress
}
