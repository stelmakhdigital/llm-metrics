# llm-metrics — прод-деплой: vLLM на хосте + api + web в docker (ТЗ §8)
#
#   make vllm-start   (vLLM на хосте, обёртка над ~/bin/work-fp8.sh)
#   make start        (api + web; или: docker compose up -d)
#
# Роли: vllm — inference на хосте (внешний скрипт, порт 8000);
# api — агрегация метрик, бизнес-правила, БД, NVML (все GPU хоста);
# web — только UI. Наружу — только web :3000.
#
# vLLM на хосте:
#   * слушать 0.0.0.0:8000 (127.0.0.1 из контейнеров НЕ виден —
#     api ходит через host.docker.internal = IP хоста в docker-мосту);
#     порт 8000 закрыть фаерволом, если сервер в доверенной сети
#   * лог — /mnt/storage/vllm/vllm.log (VLLM_LOG_DIR), api читает его
#     bind-маунтом ro (лог-источник api: LOG_SOURCE_PATH=/var/log/vllm/vllm.log)
#   * ротация: deploy/logrotate-vllm.conf (logrotate copytruncate)
#
# Требования на хосте:
#   * NVIDIA-драйвер + nvidia-container-toolkit (для NVML в api)
#   * .env — cp .env.example .env (весь конфиг api — через env)
#   * secrets/telegram_webhook.txt — файл с URL Telegram-webhook (опционально;
#     не нужен — закомментируйте секцию secrets в этом файле)
#
# Портируемый деплой: cp .env.example .env и заполнить пути своего хоста; в
# самом репо жёстко закодированных путей нет.
secrets:
  # URL Telegram-webhook для алертов (или — TELEGRAM_WEBHOOK в .env / UI)
  telegram_webhook:
    file: ./secrets/telegram_webhook.txt

services:
  # ------------------------------------------------------------------ api
  api:
    build:
      context: ./api
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: llm-metrics-api:latest
    container_name: llm-metrics-api
    # весь конфиг api — через env из .env (пример: .env.example):
    # VLLM_URL, опрос/ретенция, лог-источник, тарифы, алерты
    env_file: .env
    secrets:
      - telegram_webhook
    # vLLM на хосте: VLLM_URL=http://host.docker.internal:8000 (дефолт .env)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
      # логи vLLM — хост-каталог ro (vLLM пишет, api читает;
      # лог-источник: LOG_SOURCE_PATH=/var/log/vllm/vllm.log)
      - ${VLLM_LOG_DIR}:/var/log/vllm:ro
    # NVML-коллектор видит все GPU хоста (libnvidia-ml инжектится toolkit'ом)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # защита от утечки памяти: потолок ниже, чем у vLLM (GPU)
    mem_limit: "2g"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: unless-stopped
    # намеренно без ports: — доступ только из compose-сети

  # ------------------------------------------------------------------ web
  web:
    build:
      context: ./web
      args:
        # rewrite /api/* → apiUrl вычисляется на этапе next build
        API_URL: http://api:8100
        # версия (git describe --tags) — Makefile передаёт APP_VERSION
        APP_VERSION: ${APP_VERSION:-dev}
    image: llm-metrics-web:latest
    container_name: llm-metrics-web
    depends_on:
      - api
    ports:
      - "3000:3000"
    mem_limit: "2g"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: unless-stopped
